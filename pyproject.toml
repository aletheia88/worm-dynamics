[project]
name = "attention-predict"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.4",
    "torch>=2.6.0",
# Data handling
    "h5py>=3.13.0",
    "pyarrow>=19.0.1",
# Utils
    "tqdm>=4.67.1",
    "flv-utils",
]

[dependency-groups]
dev = [
    # Interactive plotting
    "altair>=5.5.0",
    "vegafusion>=2.0.2",
    "vl-convert-python>=1.7.0",
    # Notebook
    "marimo[recommended]>=0.12.6",
    # Typing
    "mypy>=1.15.0",
    "types-tqdm>=4.67.0.20250404",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.6.0",
]
cuda = [
  "torch>=2.6.0",
]
rocm = [
  "torch>=2.6.0",
  "pytorch-triton-rocm",
]

[tool.uv]
default-groups = ["dev"]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
    { extra = "rocm"},
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cuda" },
  { path = "/home/wsphil/projects/pytorch_rocm/wheels/torch-2.6.0-rocm6.3.3-py12/repack/torch-2.6.0+rocm6.3.3.git88b97641-cp312-cp312-linux_x86_64.whl", extra = "rocm" },
]
pytorch-triton-rocm = { path = "/home/wsphil/projects/pytorch_rocm/wheels/torch-2.6.0-rocm6.3.3-py12/repack/pytorch_triton_rocm-3.2.0+rocm6.3.3.git6da9e660-cp312-cp312-linux_x86_64.whl", extra = "rocm" }
flv-utils = { git = "ssh://git@github.com/flavell-lab/flv_utils" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

